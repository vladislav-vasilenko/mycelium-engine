[package]
name = "echo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Эхо мицелия — учебный движок на Rust и Metal 4"
publish = false

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.30"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core"] }
objc2-foundation = "0.3"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3"
raw-window-handle = "0.6"
winit = "0.30"

[profile.dev]
opt-level = 1
