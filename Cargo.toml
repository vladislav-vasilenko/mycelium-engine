[package]
name = "echo"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Эхо мицелия — учебный движок на Rust и Metal 4"
publish = false

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = "0.30"
gltf = { version = "1.4", default-features = false, features = ["names", "utils"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core"] }
objc2-foundation = "0.3"
objc2-metal = "0.3.2"
objc2-quartz-core = "0.3"
png = "0.18"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
zune-jpeg = "0.5.15"

# Свой код без оптимизаций: переменные и шаги видны в отладчике.
# Зависимости (glam, objc2, winit) оптимизированы, чтобы кадр не тормозил.
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2
